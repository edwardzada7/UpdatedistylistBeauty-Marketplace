name: Web build check

# Builds the React web app (frontend/) so broken builds are caught before deploy.
# Run manually (Actions > Web build check > Run workflow) or on every PR / push to main.
on:
  workflow_dispatch:
  pull_request:
    paths: ['frontend/**', '.github/workflows/web-build.yml']
  push:
    branches: [main]
    paths: ['frontend/**', '.github/workflows/web-build.yml']

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      CI: 'false' # CRA treats lint warnings as errors when CI=true
      REACT_APP_BACKEND_URL: ${{ vars.REACT_APP_BACKEND_URL || secrets.REACT_APP_BACKEND_URL }}
      REACT_APP_SUPABASE_URL: ${{ vars.REACT_APP_SUPABASE_URL || secrets.REACT_APP_SUPABASE_URL }}
      REACT_APP_SUPABASE_ANON_KEY: ${{ vars.REACT_APP_SUPABASE_ANON_KEY || secrets.REACT_APP_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps
      - name: Build
        run: npm run build
      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: frontend/build
          retention-days: 7
